namespace: music-helm-prod

backend:
  replicaCount: 3
  image:
    repository: music-backend
    tag: "1.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    DB_HOST: mysql-service
    DB_PORT: "3306"
    DB_NAME: hkayet8ram

frontend:
  replicaCount: 3
  image:
    repository: music-frontend
    tag: "1.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

mysql:
  replicaCount: 1
  database: hkayet8ram
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 3306
    targetPort: 3306
  storage: 10Gi
  secret:
    username: appuser
    password: AppSecret123!
    rootPassword: RootSecret123!

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: music-helm-prod.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls: []