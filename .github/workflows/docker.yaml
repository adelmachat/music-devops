name: build and push docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Log in to DockerHub GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Lowercase Repository Owner
        id: prep
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./web-site-music-backend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/music-backend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/music-backend:${{ github.sha }}

      - name: build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web-site-music-frontend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/music-frontend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/music-frontend:${{ github.sha }}